<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Braingy Workspace</title>
  <style>
    :root {
      --bg: #121316;
      --panel: #17191e;
      --border: #3a3a3a;
      --text: #f3f5f7;
      --accent: #4a9eff;
    }
    body, html {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; flex-direction: column;
    }
    /* Системный тулбар оболочки */
    .shell-toolbar {
      height: 45px; background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 15px; box-sizing: border-box; z-index: 100;
    }
    .logo { font-weight: 800; font-size: 14px; letter-spacing: 1px; }
    .modes { display: flex; gap: 6px; }
    .panel-icons-group {
      display: flex;
      gap: 4px;
      padding-right: 10px;
      margin-right: 2px;
      border-right: 1px solid var(--border);
    }
    .shell-icon-btn {
      width: 34px;
      height: 34px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #20232a;
      color: #cbd0d8;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.15s;
      box-sizing: border-box;
    }
    .shell-icon-btn:hover {
      background: #2c303b;
      border-color: #50555f;
      color: #f3f5f7;
    }
    .shell-icon-btn:active {
      transform: translateY(1px);
    }
    .shell-icon-btn .shell-svg {
      width: 18px;
      height: 18px;
      display: block;
      flex: 0 0 18px;
      overflow: visible;
      color: currentColor;
    }
    .shell-icon-btn .bold-svg {
      fill: currentColor;
    }
    .shell-icon-btn .bold-svg .secondary {
      fill: #707782;
      opacity: 0.9;
    }
    .shell-icon-btn .bold-svg .cut {
      fill: #20232a;
    }
    .shell-icon-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .shell-icon-btn.active:hover {
      background: #5aa7ff;
      border-color: #5aa7ff;
    }
    .btn {
      background: #20232a; border: 1px solid var(--border);
      color: var(--text); padding: 6px 12px; border-radius: 6px;
      cursor: pointer; font-size: 12px; font-weight: 600; transition: 0.15s;
    }
    .btn:hover { background: #2c303b; }
    .btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* Рабочая область со сплиттером */
    .workspace {
      display: flex; flex: 1; position: relative; width: 100%; min-height: 0;
    }
    iframe {
      border: none; height: 100%; width: 100%; display: block;
    }
    .panel-container {
      height: 100%; position: relative; overflow: hidden;
    }
    #leftPanel { width: 40%; } /* Таблица */
    #rightPanel { width: 60%; } /* Презентация */

    /* Сплиттер (разделитель) */
    .splitter {
      width: 6px; cursor: col-resize; background: #242424;
      position: relative; z-index: 10; transition: background 0.15s;
    }
    .splitter:hover, .splitter.active { background: var(--accent); }

 /* Режимы скрытия */
    body.mode-table #leftPanel { width: 100% !important; }
    body.mode-table #rightPanel, body.mode-table .splitter { display: none; }
    
    body.mode-pres #rightPanel { width: 100% !important; }
    body.mode-pres #leftPanel, body.mode-pres .splitter { display: none; }

    #editorFrame { display: none; }
    body.mode-editor #tableFrame { display: none !important; }
    body.mode-editor #editorFrame { display: block !important; }

    /* =========================================================
       SHELL SETTINGS PANEL (дизайн-системы кнопок/панелей)
       ========================================================= */
    #shellSettingsPanel{
      position: fixed; top: 52px; right: 12px; width: 332px;
      background: #17191e; border: 1px solid var(--border); border-radius: 14px;
      box-shadow: 0 18px 50px rgba(0,0,0,.6); z-index: 500;
      padding: 12px; color: var(--text); font-size: 12px;
    }
    #shellSettingsPanel[hidden]{ display: none; }
    #shellSettingsPanel .ss-title{
      font-size: 9px; font-weight: 800; letter-spacing: .12em;
      color: #8b93a1; text-transform: uppercase; margin: 2px 2px 8px;
    }
    #shellSettingsPanel .ss-caption{
      font-size: 10.5px; line-height: 1.45; color: #8b93a1; margin: 0 2px 10px;
    }
    .ss-theme-card{
      display: flex; gap: 10px; align-items: center; width: 100%;
      background: #1d2027; border: 1px solid #3a3a3a; border-radius: 10px;
      padding: 9px 10px; margin-bottom: 7px; cursor: pointer;
      color: var(--text); text-align: left; transition: border-color .15s, background .15s;
    }
    .ss-theme-card:hover{ background: #232733; border-color: #50555f; }
    .ss-theme-card.is-active{ border-color: var(--accent); background: rgba(74,158,255,.08); }
    .ss-theme-preview{
      flex: 0 0 92px; height: 46px; border-radius: 8px; background: #14161b;
      border: 1px solid #33363f; display: flex; gap: 4px; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .ss-theme-meta{ min-width: 0; }
    .ss-theme-name{ font-size: 12px; font-weight: 700; }
    .ss-theme-desc{ font-size: 10px; color: #8b93a1; line-height: 1.35; margin-top: 2px; }
    .ss-check{
      margin-left: auto; color: var(--accent); font-weight: 800; font-size: 13px; visibility: hidden;
    }
    .ss-theme-card.is-active .ss-check{ visibility: visible; }
    /* превью Studio */
    .ss-p-studio .p-btn{ background:#20232a; border:1px solid #3a3a3a; border-radius:8px; width:26px; height:14px; }
    .ss-p-studio .p-tab{ background:#20232a; border:1px solid #3a3a3a; border-radius:8px; width:20px; height:11px; }
    .ss-p-studio .p-act{ background:#4a9eff; border-color:#4a9eff; }
    /* превью Outline */
    .ss-p-aura .p-btn{ background:rgba(255,255,255,.09); border:1px solid transparent; border-radius:10px; width:26px; height:14px; }
    .ss-p-aura .p-tab{ background:rgba(255,255,255,.05); border:1px solid transparent; border-radius:9px; width:20px; height:11px; }
    .ss-p-aura .p-act{ background:rgba(255,255,255,.22); }
    /* превью Soft */
    .ss-p-soft .p-btn{ background:#262b34; border:1px solid transparent; border-radius:999px; width:26px; height:14px; box-shadow:0 2px 6px rgba(0,0,0,.35); }
    .ss-p-soft .p-tab{ background:#262b34; border:1px solid transparent; border-radius:999px; width:20px; height:11px; }
    .ss-p-soft .p-act{ background:#4a9eff; }
    .ss-p-noir{ background:#12151c; border-color:#262c39; }
    .ss-p-noir .p-head{ width:34px; height:3px; background:#262c39; border-radius:0; margin-bottom:4px; }
    .ss-p-noir .p-btn{ background:#161a22; border:1px solid #2c3442; border-radius:9px; width:26px; height:13px; }
    .ss-p-noir .p-tab{ background:#141821; border:1px solid #2c3442; border-radius:8px; width:20px; height:11px; }
    .ss-p-noir .p-tab.p-act{ background:#f5f7fa; border-color:#f5f7fa; }

    /* ТЕМЫ ДЛЯ КНОПОК САМОГО SHELL (toolbar) */
    body[data-btn-theme="studio"] .shell-icon-btn{ border-radius:8px; }
    body[data-btn-theme="aura"] .shell-icon-btn,
    body[data-btn-theme="aura"] .modes .btn{
      background: rgba(255,255,255,.05); border: 1px solid transparent; border-radius: 10px;
      color: #e8ebf1;
    }
    body[data-btn-theme="aura"] .shell-icon-btn:hover{ background: rgba(255,255,255,.10); }
    body[data-btn-theme="aura"] .shell-icon-btn.active{ background: rgba(255,255,255,.17); color: #fff; }
    body[data-btn-theme="soft"] .shell-icon-btn,
    body[data-btn-theme="soft"] .modes .btn{
      background: #262b34; border: 1px solid transparent; border-radius: 999px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
    }
    body[data-btn-theme="soft"] .shell-icon-btn:hover{ background: #2f3542; transform: translateY(-1px); }
    body[data-btn-theme="soft"] .shell-icon-btn.active{
      background: #4a9eff; color: #fff;
      box-shadow: none;
    }

    /* Правила для вывода на печать (PDF-экспорт из Electron) */
    @media print {
      .shell-toolbar { display: none !important; }
      .workspace { height: 100vh !important; width: 100vw !important; }
      #leftPanel, .splitter { display: none !important; }
      #rightPanel { width: 100% !important; height: 100% !important; }
    }
  </style>
</head>

  <script>
    const leftPanel = document.getElementById('leftPanel');
    const rightPanel = document.getElementById('rightPanel');
    const splitter = document.getElementById('splitter');
    const workspace = document.getElementById('workspace');
const { ipcRenderer } = require('electron');
    let appConfig = {};
    let configReady = false;
    let configQueue = [];

    function saveConfig() {
      if (configReady) ipcRenderer.send('save-app-config', appConfig);
    }

    ipcRenderer.invoke('get-app-config').then(cfg => {
      appConfig = cfg || {};
      configReady = true;
      if (appConfig.splitterPos) {
        leftPanel.style.width = appConfig.splitterPos + "%";
        rightPanel.style.width = (100 - parseFloat(appConfig.splitterPos)) + "%";
      }
      configQueue.forEach(win => win.postMessage({ type: 'INIT_CONFIG', config: appConfig }, '*'));
      configQueue = [];
    });
 // --- 1. ПЕРЕКЛЮЧЕНИЕ РЕЖИМОВ ЭКРАНА ---
/* =========================================================
   SHELL PANEL BRIDGE — SHELL PANEL COMMANDS JS START
   ========================================================= */
let activeShellPresentationPanel =
  localStorage.getItem('workspace_presentation_panel') || 'concept';

function togglePresPanel(panelId) {
  const presFrame = document.getElementById('presFrame');

  if (!presFrame || !presFrame.contentWindow) return;

  const panelMap = {
    concept: 'concept',
    pages: 'pages',
    ai: 'aipc',
    templates: 'templates',
    hotkeys: 'hotkeys',
    project: 'deck'
  };

  const targetSection = panelMap[panelId];
  if (!targetSection) return;

  const nextSection = activeShellPresentationPanel === targetSection
    ? 'none'
    : targetSection;

  activeShellPresentationPanel = nextSection;
  localStorage.setItem('workspace_presentation_panel', nextSection);

  const panelSelect = document.getElementById('shellPresentationPanelSelect');
  if (panelSelect) panelSelect.value = nextSection;

  presFrame.contentWindow.postMessage({
    type: 'SHELL_SELECT_PRESENTATION_PANEL',
    section: nextSection
  }, '*');
}
function selectPresentationPanel(section) {
  const presFrame = document.getElementById("presFrame");

  if (!presFrame || !presFrame.contentWindow) return;

  const safeSection = [
    "none",
    "deck",
    "concept",
    "templates",
    "templates-manager",
    "pages",
    "ai",
    "aipc",
    "page",
    "frame",
    "text",
    "export",
    "tech",
    "hotkeys"
  ].includes(section) ? section : "concept";

  activeShellPresentationPanel = safeSection;
  localStorage.setItem(
    "workspace_presentation_panel",
    safeSection
  );

  const panelSelect = document.getElementById('shellPresentationPanelSelect');
  if (panelSelect) panelSelect.value = safeSection;

  presFrame.contentWindow.postMessage({
    type: "SHELL_SELECT_PRESENTATION_PANEL",
    section: safeSection
  }, "*");
}
/* =========================================================
   SHELL PANEL BRIDGE — SHELL PANEL COMMANDS JS END
   ========================================================= */
/* =========================================================
   SHELL SETTINGS — переключение дизайн-систем кнопок/панелей.
   Хранение: localStorage 'workspace_button_theme'.
   Presentation получает SHELL_BUTTON_THEME (css в js/panel-ui.js).
   ========================================================= */
function shellButtonThemeSafe(theme) {
  if (theme === 'outline') theme = 'aura'; /* legacy: Outline Pro заменён на Aura */
  if (theme === 'paper') theme = 'noir';   /* legacy: светлая Paper заменена на Noir */
  return ['studio', 'aura', 'soft', 'noir'].includes(theme) ? theme : 'studio';
}
function selectButtonTheme(theme) {
  const safe = shellButtonThemeSafe(theme);
  document.body.dataset.btnTheme = safe;
  localStorage.setItem('workspace_button_theme', safe);
  document.querySelectorAll('[data-theme-card]').forEach(card => {
    card.classList.toggle('is-active', card.dataset.themeCard === safe);
  });
  const presFrame = document.getElementById('presFrame');
  if (presFrame && presFrame.contentWindow) {
    presFrame.contentWindow.postMessage({ type: 'SHELL_BUTTON_THEME', theme: safe }, '*');
  }
}
function toggleShellSettings() {
  const panel = document.getElementById('shellSettingsPanel');
  if (!panel) return;
  panel.hidden = !panel.hidden;
  if (!panel.hidden) {
    const current = shellButtonThemeSafe(localStorage.getItem('workspace_button_theme') || 'studio');
    document.querySelectorAll('[data-theme-card]').forEach(card => {
      card.classList.toggle('is-active', card.dataset.themeCard === current);
    });
  }
}
document.addEventListener('click', function(e) {
  const panel = document.getElementById('shellSettingsPanel');
  const btn = document.getElementById('btnShellSettings');
  if (!panel || panel.hidden) return;
  if (panel.contains(e.target) || (btn && btn.contains(e.target))) return;
  panel.hidden = true;
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    const panel = document.getElementById('shellSettingsPanel');
    if (panel && !panel.hidden) panel.hidden = true;
  }
});

function setMode(mode) {
  document.body.className = 'mode-' + mode;
  localStorage.setItem('workspace_mode', mode); // Запоминаем режим

  document.querySelectorAll('.modes .btn').forEach(b => b.classList.remove('active'));
  if (mode === 'table') document.getElementById('btnTable').classList.add('active');
  if (mode === 'pres') document.getElementById('btnPres').classList.add('active');
  if (mode === 'editor') document.getElementById('btnEditor').classList.add('active');
  if (mode === 'split') {
    document.getElementById('btnSplit').classList.add('active');
    
// Восстанавливаем сохраненную пропорцию сплиттера или ставим 40% по дефолту
        const savedSplit = appConfig.splitterPos || localStorage.getItem('workspace_splitter_pos') || "40";
        leftPanel.style.width = savedSplit + "%";
        rightPanel.style.width = (100 - parseFloat(savedSplit)) + "%";
  }
  
  const presFrame = document.getElementById('presFrame').contentWindow;
  presFrame.postMessage({ type: 'SHELL_MODE', mode: mode }, '*');
  if (mode === 'pres') {
    requestAnimationFrame(() => {
      const presFrameEl = document.getElementById('presFrame');
      if (presFrameEl && presFrameEl.contentWindow) {
        presFrameEl.contentWindow.focus();
      }
    });
  }
}

// Восстановление режима и пропорций при старте
window.addEventListener('load', function() {
  selectButtonTheme(shellButtonThemeSafe(localStorage.getItem('workspace_button_theme') || 'studio'));
  const savedMode = localStorage.getItem('workspace_mode') || 'pres';
  setMode(savedMode);
  const panelSelect = document.getElementById(
    "shellPresentationPanelSelect"
  );

  const savedPresentationPanel =
    localStorage.getItem(
      "workspace_presentation_panel"
    ) || "concept";

  if (panelSelect) {
    panelSelect.value = savedPresentationPanel;
  }

  setTimeout(() => {
    selectPresentationPanel(savedPresentationPanel);
  }, 180);
  const zenithSelect = document.getElementById('zenithModeSelect');
  const savedZenithMode = (appConfig && appConfig.zenithMode) || localStorage.getItem('workspace_zenith_mode') || (zenithSelect ? zenithSelect.value : '4');

  if (zenithSelect) {
    zenithSelect.value = String(savedZenithMode);
  }

  setTimeout(() => {
    switchZenithMode(savedZenithMode);
  }, 100);
});

// --- 2. РАБОТА СПЛИТТЕРА (С сохранением положения) ---
let isDragging = false;
splitter.addEventListener('mousedown', function(e) {
  isDragging = true;
  splitter.classList.add('active');
  document.body.style.cursor = 'col-resize';
  leftPanel.style.pointerEvents = 'none';
  rightPanel.style.pointerEvents = 'none';
});

document.addEventListener('mousemove', function(e) {
  if (!isDragging) return;
  const containerWidth = workspace.offsetWidth;
  let leftWidthPx = e.clientX;
  
  if (leftWidthPx < 250) leftWidthPx = 250;
  if (leftWidthPx > containerWidth - 250) leftWidthPx = containerWidth - 250;

  const leftPercentage = (leftWidthPx / containerWidth) * 100;
  leftPanel.style.width = leftPercentage + '%';
  rightPanel.style.width = (100 - leftPercentage) + '%';
  
// Запоминаем в памяти на лету без обращения к диску и IPC
  appConfig.splitterPos = leftPercentage;
});

document.addEventListener('mouseup', function() {
      if (isDragging) {
        isDragging = false;
        splitter.classList.remove('active');
        document.body.style.cursor = 'default';
        leftPanel.style.pointerEvents = 'auto';
        rightPanel.style.pointerEvents = 'auto';
        if (appConfig.splitterPos) {
          localStorage.setItem('workspace_splitter_pos', appConfig.splitterPos);
          saveConfig();
        }
      }
    });

    // --- 3. ИНТЕРАКТИВНЫЙ МОСТ СВЯЗИ (postMessage Router) ---
    const SHELL_MODE_HOTKEYS = {
      Digit1: 'table',
      Digit2: 'pres',
      Digit3: 'split',
      Digit4: 'editor'
    };

    function isShellModeTextInput(target) {
      if (!target || !(target instanceof Element)) return false;
      return target.isContentEditable ||
        !!target.closest('[contenteditable="true"]') ||
        !!target.closest('input, textarea, select');
    }

    function getShellModeFromKeyboardEvent(event) {
      if (!event.altKey || event.shiftKey || event.ctrlKey || event.metaKey) return null;
      return SHELL_MODE_HOTKEYS[event.code] || null;
    }

    function requestShellModeFromShell(event) {
      const mode = getShellModeFromKeyboardEvent(event);
      if (!mode || isShellModeTextInput(event.target)) return false;
      event.preventDefault();
      event.stopImmediatePropagation();
      setMode(mode);
      return true;
    }
window.addEventListener('message', function(event) {
      const tableFrame = document.getElementById('tableFrame').contentWindow;
      const presFrame = document.getElementById('presFrame').contentWindow;
      const editorFrameEl = document.getElementById('editorFrame');
      const editorFrame = editorFrameEl ? editorFrameEl.contentWindow : null;
      if (event.data && event.data.type === 'SHELL_MODE_HOTKEY_REQUEST') {
        const requestedMode = event.data.mode;
        const isKnownFrame = event.source === tableFrame || event.source === presFrame || event.source === editorFrame;
        if (isKnownFrame && ['table', 'pres', 'split', 'editor'].includes(requestedMode)) {
          setMode(requestedMode);
        }
        return;
      }
// Обработка запроса конфигурации (решение проблемы гонки асинхронности)
      if (event.data && event.data.type === 'REQUEST_INITIAL_CONFIG') {
        if (configReady) {
          event.source.postMessage({ type: 'INIT_CONFIG', config: appConfig }, '*');
        } else {
          configQueue.push(event.source);
        }
        return;
      }
      // Сохранение параметров от дочерних фреймов
      if (event.data && event.data.type === 'UPDATE_CONFIG') {
        appConfig[event.data.key] = event.data.value;
        saveConfig();
        return;
      }
      // Синхронизация selector shell с фактически открытой панелью Presentation
      if (event.source === presFrame && event.data && event.data.type === 'PRESENTATION_PANEL_STATE') {
        const panelSelect = document.getElementById('shellPresentationPanelSelect');
        const section = event.data.section;
        const safeSection = [
          'none',
          'deck',
          'concept',
          'templates',
          'templates-manager',
          'pages',
          'ai',
          'aipc',
          'page',
          'frame',
          'text',
          'export',
          'tech',
          'hotkeys'
        ].includes(section) ? section : 'concept';
        activeShellPresentationPanel = safeSection;
        if (panelSelect) panelSelect.value = safeSection;
        localStorage.setItem('workspace_presentation_panel', safeSection);
        return;
      }
      // AUTO EDITOR ROUTING V1: Presentation просит открыть панель
      // под тип выделенного объекта (text -> Text, image -> Frame, page -> Concept).
      // Существующий механизм: selectPresentationPanel сами валидируют
      // секцию и синхронизируют селектор Shell.
      if (event.source === presFrame && event.data && event.data.type === 'PRESENTATION_REQUEST_PANEL') {
        const requestedSection = ['text', 'frame', 'concept', 'templates'].includes(event.data.section)
          ? event.data.section
          : null;
        if (requestedSection) {
          selectPresentationPanel(requestedSection);
        }
        return;
      }
      // Пересылаем сообщения из Таблицы в Презентацию
      if (event.source === tableFrame) {
        presFrame.postMessage(event.data, '*');
      }
      // Пересылаем сообщения из Блокнота в Презентацию
      if (editorFrame && event.source === editorFrame) {
        presFrame.postMessage(event.data, '*');
      }
      // Пересылаем сообщения из Презентации в Таблицу и Блокнот
      if (event.source === presFrame) {
        tableFrame.postMessage(event.data, '*');
        if (editorFrame) {
          editorFrame.postMessage(event.data, '*');
        }
      }
    });
// --- УПРАВЛЕНИЕ РЕЖИМАМИ ZENITH ---
    function switchZenithMode(mode) {
      const normalizedMode = String(mode);
      const zenithSelect = document.getElementById('zenithModeSelect');
      if (zenithSelect && zenithSelect.value !== normalizedMode) {
        zenithSelect.value = normalizedMode;
      }

      localStorage.setItem('workspace_zenith_mode', normalizedMode);
      appConfig.zenithMode = normalizedMode;
      saveConfig();

      const editorFrameEl = document.getElementById('editorFrame');
      if (editorFrameEl && editorFrameEl.contentWindow) {
        editorFrameEl.contentWindow.postMessage({ type: 'set-zenith-mode', mode: normalizedMode }, '*');
      }
    }

    // --- 4. ПЕРЕНАПРАВЛЕНИЕ ГОРЯЧИХ КЛАВИШ ВО ФРЕЙМ ТАБЛИЦЫ ---

    // Если фокус находится на родительской оболочке, пересылаем Ctrl+M и Ctrl+F во фрейм таблицы.
    window.addEventListener('keydown', function(e) {
      if (requestShellModeFromShell(e)) return;
      const isControl = e.ctrlKey || e.metaKey;
      const keyLower = e.key.toLowerCase();
      if (isControl && (keyLower === 'm' || keyLower === 'f')) {
        e.preventDefault();
        const tableFrame = document.getElementById('tableFrame');
        if (tableFrame && tableFrame.contentWindow) {
          tableFrame.contentWindow.postMessage({
            type: 'SHELL_KEYBOARD_EVENT',
            ctrlKey: e.ctrlKey,
            metaKey: e.metaKey,
            key: e.key
          }, '*');
        }
      }
    });
  </script>
</body>
